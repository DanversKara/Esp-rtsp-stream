# =============================================================================
# CCTV Box v6 "NVR" - 4-camera viewer + SD-card recorder for the
# ESP32-S3-BOX-3 (+ BOX-3-SENSOR base for its microSD slot)
# -----------------------------------------------------------------------------
# Built as a hybrid, per the design review:
#   BASE      Start_From_Scratch_Code.yaml hardware blocks, 100% kept:
#             LCD + backlight, battery, speaker/mic (ES8311/ES7210), both I2C
#             buses, WiFi + fallback AP, Bluetooth proxy, USB logging.
#             (Only the "READY" display lambda is gone - LVGL owns the LCD.)
#   VIEWER    esp_rtsp_stream upstream design: one 320x240 stream per camera,
#             decoder scales it to whatever canvas is on screen.
#   ADDED     the cctv fork additions upstream does not have: HTTP MJPEG
#             sessions (motionEye), runtime canvas routing, idle disconnect,
#             MJPEG AVI recording + the cctv_sdcard component.
#
#  Screens (NO floating windows):
#   Viewer   the HOME page. One camera full-screen 320x240. The bottom
#            button bar (1 2 3 4 | FIT/STR/CROP | REC | GRID) is HIDDEN -
#            tap the picture to show it, it hides again after 5 s.
#   Grid     all four cameras 2x2 at 160x120 from the same streams.
#            Tap a cell to open it in the viewer; X goes back.
#   FIT/STR/CROP: per-screen picture fit, cycled by the mode button
#            (viewer bar, and top-centre on the grid). FIT = keep shape,
#            black bars. STR = stretch to fill exactly. CROP = fill and
#            centre-crop the overflow. Saved across reboots, per screen.
#  Recordings: /sdcard/cctv/<YYYYMMDD_HHMMSS>_<name>.avi (Motion-JPEG AVI,
#  plays in VLC), split every few minutes, oldest deleted below 1 GB free.
#  Recording writes the raw stream frames, not the scaled screen picture.
# =============================================================================

substitutions:
  name: cctv-box
  friendly_name: CCTV Box
  # Camera streams. rtsp:// (RTP/JPEG - the stream MUST be MJPEG, this box
  # cannot decode H.264) and http:// (motionEye multipart MJPEG) both work
  # and can be mixed per camera.
  # Cam 1 pulls its RTSP feed DIRECTLY from the camera (the same feed
  # motionEye pulls), so it no longer depends on motionEye staying up.
  cam1_url: "rtsp://192.168.8.230/live1"
  cam2_url: "http://192.168.8.212:9084"
  cam3_url: "http://192.168.8.212:9085"
  cam4_url: "http://192.168.8.212:9081"   # same camera as cam1 (via motionEye) for now
  # If cam 2's camera (192.168.8.223) serves the same /live1 path, switch it
  # to direct too:  cam2_url: "rtsp://192.168.8.223/live1"
  # Names show on screen, in HA and in recording file names (keep them unique).
  cam1_name: "DOOR"
  cam2_name: "WINDOW"
  cam3_name: "PARKING LOT"
  cam4_name: "DOOR 2"
  # On-screen decode rate per camera (single view, and 2x2 grid).
  cctv_single_fps: "4"
  cctv_grid_fps: "2"
  # Recording: frames per second written to the card, and length of each file.
  cctv_record_fps: "2"
  cctv_record_segment: "5min"
  # From the scratch base config:
  wifi_fallback_pwd: s3box123

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2026.4.0
  project:
    name: "Christian.s3box3"
    version: "6.0.0"
  on_boot:
    # Resume recordings that were on before a reboot, once the clock is set
    # (file names use the date/time).
    - priority: -100
      then:
        - wait_until:
            condition:
              lambda: 'return id(sntp_time).now().is_valid();'
            timeout: 90s
        - lambda: |-
            esp_rtsp_stream::RtspMjpeg *cams[4] = {id(cam1), id(cam2), id(cam3), id(cam4)};
            for (int i = 0; i < 4; i++)
              if (id(rec_mask) & (1 << i)) cams[i]->start_recording();
        - script.execute: cctv_rec_refresh

esp32:
  board: esp32s3box
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
      # Keep 64 KB of internal (DMA-capable) RAM for the display SPI and the
      # SD card, so camera streams can't starve them.
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "65536"
    advanced:
      execute_from_psram: true

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components: [ esp_rtsp_stream, cctv_sdcard ]

# ── USB / logging (scratch base) ────────────────────────────────────────────
logger:
  hardware_uart: USB_SERIAL_JTAG

# ── Home Assistant API ──────────────────────────────────────────────────────
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

# ── WiFi + fallback AP (scratch base + multi-stream tuning) ─────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  # Network buffers in PSRAM: several camera streams would otherwise use up
  # internal RAM ("spi_master: Failed to allocate priv TX buffer").
  use_psram: true
  ap:
    ssid: ${name}
    password: ${wifi_fallback_pwd}

captive_portal:

# ── Bluetooth proxy (scratch base) ──────────────────────────────────────────
# Shares the radio with WiFi. If the grid stutters, comment these two blocks
# out - the CCTV side does not use Bluetooth at all.
esp32_ble_tracker:
bluetooth_proxy:
  active: true

time:
  - platform: sntp
    id: sntp_time

# ── I2C: bus_a = touch + audio codecs, bus_b = sensor base (scratch base) ───
i2c:
  - id: bus_a
    sda: GPIO08
    scl: GPIO18
    scan: true
    frequency: 100kHz
  - id: bus_b
    sda: GPIO41
    scl: GPIO40
    scan: true
    frequency: 100kHz

spi:
  - id: spi_bus
    clk_pin: 7
    mosi_pin: 6

# =============================================================================
# Cameras and SD card
# =============================================================================
# Each stream is moved at runtime to whichever canvas is on screen (viewer or
# a grid cell) by the cctv_route script. A camera that is neither on screen
# nor recording disconnects after idle_timeout.
esp_rtsp_stream:
  - id: cam1
    url: ${cam1_url}
    lvgl_canvas: viewer_canvas
    max_fps: ${cctv_single_fps}
    max_frame_size: 262144        # 256 KB per JPEG
    idle_timeout: 10s             # disconnect when off screen (unless recording)
    record_dir: /sdcard/cctv
    record_label: "${cam1_name}"
    record_fps: ${cctv_record_fps}
    record_segment: ${cctv_record_segment}
    log_frame_info: true
  - id: cam2
    url: ${cam2_url}
    lvgl_canvas: cctv_grid_canvas_2
    max_fps: ${cctv_single_fps}
    max_frame_size: 262144
    idle_timeout: 10s
    record_dir: /sdcard/cctv
    record_label: "${cam2_name}"
    record_fps: ${cctv_record_fps}
    record_segment: ${cctv_record_segment}
    log_frame_info: true
  - id: cam3
    url: ${cam3_url}
    lvgl_canvas: cctv_grid_canvas_3
    max_fps: ${cctv_single_fps}
    max_frame_size: 262144
    idle_timeout: 10s
    record_dir: /sdcard/cctv
    record_label: "${cam3_name}"
    record_fps: ${cctv_record_fps}
    record_segment: ${cctv_record_segment}
    log_frame_info: true
  - id: cam4
    url: ${cam4_url}
    lvgl_canvas: cctv_grid_canvas_4
    max_fps: ${cctv_single_fps}
    max_frame_size: 262144
    idle_timeout: 10s
    record_dir: /sdcard/cctv
    record_label: "${cam4_name}"
    record_fps: ${cctv_record_fps}
    record_segment: ${cctv_record_segment}
    log_frame_info: true

# microSD on the BOX-3-SENSOR base (4-bit SDMMC; pins are the defaults).
# Card must be FAT32 (cards over 32 GB usually come as exFAT - reformat them).
cctv_sdcard:
  id: sd_card
  recordings_dir: /sdcard/cctv
  min_free: 1GB          # delete the oldest recordings below this
  keep_newest: 8         # ...but never the newest 8 files

# =============================================================================
# Hardware: backlight, display, touch (scratch base pins)
# =============================================================================
output:
  - platform: ledc
    pin: GPIO47
    id: backlight_output

display:
  - platform: mipi_spi
    id: s3_box_lcd
    model: S3BOX
    data_rate: 40MHz
    cs_pin: 5
    dc_pin: 4
    reset_pin:
      number: 48
      inverted: true
    color_order: bgr
    invert_colors: false

touchscreen:
  - platform: gt911
    id: box_touch
    i2c_id: bus_a
    display: s3_box_lcd

binary_sensor:
  # The red circle under the screen: back to the viewer (home) page.
  - platform: gt911
    name: "Home Button"
    index: 0
    on_press:
      - globals.set:
          id: current_page
          value: '"home"'
      - lvgl.page.show: home_page
  - platform: template
    name: "SD Card Mounted"
    icon: mdi:sd
    entity_category: diagnostic
    lambda: 'return id(sd_card).is_mounted();'

# ── Audio hardware: mic + speaker drivers (scratch base, kept whole) ──────
i2s_audio:
  - id: audio_bus
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO2

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_a
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    bits_per_sample: 16bit
    sample_rate: 48000

microphone:
  - platform: i2s_audio
    id: box_mic
    sample_rate: 16000
    i2s_din_pin: GPIO16
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - id: i2s_audio_speaker
    platform: i2s_audio
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO15
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: mono
    audio_dac: es8311_dac
    buffer_duration: 100ms

font:
  - file: "gfonts://Roboto"
    id: font_medium
    size: 22
  - file: "gfonts://Roboto"
    id: font_small
    size: 16

# ── LCD backlight (scratch base) ────────────────────────────────────────────
light:
  - platform: monochromatic
    id: backlight
    name: "LCD Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON

# =============================================================================
# State
# =============================================================================
globals:
  - id: current_page
    type: std::string
    restore_value: false
    initial_value: '"home"'
  # Camera shown in the viewer (0-3 = cam1-cam4). Survives reboots.
  - id: cctv_view_cam
    type: int
    restore_value: true
    initial_value: '0'
  # Picture fit per screen: 0 = FIT, 1 = STRETCH, 2 = CROP. Saved.
  - id: viewer_aspect
    type: int
    restore_value: true
    initial_value: '0'
  - id: grid_aspect
    type: int
    restore_value: true
    initial_value: '0'
  # Viewer bottom button bar: hidden until the picture is tapped.
  - id: viewer_bar_on
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: viewer_bar_ticks
    type: int
    restore_value: false
    initial_value: '0'
  # Which cameras are recording (bit 0 = cam1), restored after a reboot.
  - id: rec_mask
    type: int
    restore_value: true
    initial_value: '0'
  - id: rec_blink
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  #── Give each camera the canvas that's about to be on screen.
  # view: 1 = viewer page (selected camera, full 320x240), 3 = 2x2 grid
  # (all four, 160x120 each). Cameras with no canvas are "parked" and
  # disconnect after idle_timeout (unless recording).
  - id: cctv_route
    parameters:
      view: int
    then:
      - lambda: |-
          using esp_rtsp_stream::RtspMjpeg;
          RtspMjpeg *cams[4] = {id(cam1), id(cam2), id(cam3), id(cam4)};
          static lv_obj_t *parked = nullptr;
          for (RtspMjpeg *c : cams) c->set_lvgl_canvas(&parked);
          auto attach = [](RtspMjpeg *c, lv_obj_t **canvas, int w, int h, int fps, int mode) {
            lv_canvas_fill_bg(*canvas, lv_color_hex(0x000000), LV_OPA_COVER);
            c->set_output_size(w, h);
            c->set_max_fps(fps);
            c->set_aspect_mode(mode);
            c->set_lvgl_canvas(canvas);
          };
          if (view == 1) {
            attach(cams[id(cctv_view_cam) & 3], &id(viewer_canvas), 320, 240, ${cctv_single_fps},
                   id(viewer_aspect));
          } else if (view == 3) {
            lv_obj_t **grid[4] = {&id(cctv_grid_canvas_1), &id(cctv_grid_canvas_2),
                                  &id(cctv_grid_canvas_3), &id(cctv_grid_canvas_4)};
            for (int i = 0; i < 4; i++) attach(cams[i], grid[i], 160, 120, ${cctv_grid_fps},
                                               id(grid_aspect));
          }

  #── Mode button labels: FIT / STR / CROP for the viewer and the grid ──
  - id: aspect_refresh
    then:
      - lambda: |-
          const char *names[3] = {"FIT", "STR", "CROP"};
          lv_label_set_text(id(viewer_mode_label), names[std::max(0, std::min(2, id(viewer_aspect)))]);
          lv_label_set_text(id(grid_mode_label), names[std::max(0, std::min(2, id(grid_aspect)))]);

  #── Viewer bottom bar: show/hide the bar background and all its buttons ──
  - id: viewer_bar_apply
    then:
      - lambda: |-
          lv_obj_t *items[8] = {id(viewer_bar_bg), id(cctv_sel_1), id(cctv_sel_2), id(cctv_sel_3),
                                id(cctv_sel_4), id(viewer_mode_btn), id(cctv_rec_btn), id(cctv_grid_btn)};
          for (lv_obj_t *o : items) {
            if (id(viewer_bar_on)) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          }

  #── Viewer page: camera name, highlighted 1-4 button, REC button state ──
  - id: viewer_refresh
    then:
      - lambda: |-
          const char *names[4] = {"${cam1_name}", "${cam2_name}", "${cam3_name}", "${cam4_name}"};
          esp_rtsp_stream::RtspMjpeg *cams[4] = {id(cam1), id(cam2), id(cam3), id(cam4)};
          const int v = id(cctv_view_cam) & 3;
          lv_label_set_text(id(viewer_name), names[v]);
          lv_obj_t *chips[4] = {id(cctv_sel_1), id(cctv_sel_2), id(cctv_sel_3), id(cctv_sel_4)};
          for (int i = 0; i < 4; i++)
            lv_obj_set_style_bg_color(chips[i], lv_color_hex(i == v ? 0x16A085 : 0x1F2632), 0);
          const bool rec = cams[v]->is_recording();
          lv_label_set_text(id(cctv_rec_btn_label), rec ? "STOP" : "REC");
          lv_obj_set_style_bg_color(id(cctv_rec_btn), lv_color_hex(rec ? 0xE74C3C : 0x1F2632), 0);

  #── Start/stop recording one camera (remembered across reboots) ──
  - id: cctv_rec_set
    mode: queued
    parameters:
      cam: int
      enable: bool   # not "on": YAML reads a bare on as true
    then:
      - lambda: |-
          esp_rtsp_stream::RtspMjpeg *cams[4] = {id(cam1), id(cam2), id(cam3), id(cam4)};
          const int i = cam & 3;
          if (enable) {
            cams[i]->start_recording();
            id(rec_mask) |= (1 << i);
          } else {
            cams[i]->stop_recording();
            id(rec_mask) &= ~(1 << i);
          }
      - script.execute: cctv_rec_refresh

  #── REC badges. Red "REC" = writing to the card; orange "REC..." =
  # switched on but waiting (no SD card yet, or camera reconnecting).
  - id: cctv_rec_refresh
    then:
      - lambda: |-
          esp_rtsp_stream::RtspMjpeg *cams[4] = {id(cam1), id(cam2), id(cam3), id(cam4)};
          auto badge = [](lv_obj_t *l, esp_rtsp_stream::RtspMjpeg *c, bool blink) {
            if (!c->is_recording()) {
              lv_obj_add_flag(l, LV_OBJ_FLAG_HIDDEN);
              return;
            }
            const bool writing = c->is_writing();
            lv_label_set_text(l, writing ? "REC" : "REC...");
            lv_obj_set_style_bg_color(l, lv_color_hex(writing ? 0xE74C3C : 0xE67E22), 0);
            lv_obj_set_style_bg_opa(l, (writing && blink) ? LV_OPA_40 : LV_OPA_COVER, 0);
            lv_obj_clear_flag(l, LV_OBJ_FLAG_HIDDEN);
          };
          const bool blink = id(rec_blink);
          lv_obj_t *grid[4] = {id(cctv_grid_rec_1), id(cctv_grid_rec_2), id(cctv_grid_rec_3), id(cctv_grid_rec_4)};
          lv_obj_t *chips[4] = {id(cctv_sel_1_label), id(cctv_sel_2_label), id(cctv_sel_3_label), id(cctv_sel_4_label)};
          for (int i = 0; i < 4; i++) {
            badge(grid[i], cams[i], blink);
            lv_obj_set_style_text_color(chips[i], lv_color_hex(cams[i]->is_recording() ? 0xFF6B5B : 0xFFFFFF), 0);
          }
          badge(id(viewer_rec), cams[id(cctv_view_cam) & 3], blink);
      - script.execute: viewer_refresh

interval:
  # Clock, SD status and "Connecting..." overlays.
  - interval: 1s
    then:
      - lambda: |-
          auto t = id(sntp_time).now();
          if (t.is_valid()) {
            std::string ts = t.strftime("%I:%M %p");
            if (!ts.empty() && ts[0] == '0') ts.erase(0, 1);
            lv_label_set_text(id(viewer_clock), ts.c_str());
          }
          char sd[24];
          if (id(sd_card).is_mounted()) snprintf(sd, sizeof(sd), "SD %.1f GB", id(sd_card).get_free_gb());
          else snprintf(sd, sizeof(sd), "NO SD");
          lv_label_set_text(id(viewer_sd), sd);
          lv_obj_set_style_text_color(id(viewer_sd), lv_color_hex(id(sd_card).is_mounted() ? 0xFFFFFF : 0xE67E22), 0);
          const bool wifi_ok = wifi::global_wifi_component->is_connected();
          const bool api_ok = api::global_api_server->is_connected();
          lv_obj_set_style_text_color(id(wifi_icon), lv_color_hex(wifi_ok ? 0x2ECC71 : 0xE74C3C), 0);
          lv_obj_set_style_text_color(id(ha_icon), lv_color_hex(api_ok ? 0x2ECC71 : 0xE74C3C), 0);

          using esp_rtsp_stream::RtspMjpeg;
          RtspMjpeg *cams[4] = {id(cam1), id(cam2), id(cam3), id(cam4)};
          auto show = [](lv_obj_t *l, RtspMjpeg *c) {
            const bool streaming = c->is_streaming();
            if (streaming && c->has_frame()) {
              lv_obj_add_flag(l, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_label_set_text(l, streaming ? "Waiting for video..." : "Connecting...");
              lv_obj_clear_flag(l, LV_OBJ_FLAG_HIDDEN);
            }
          };
          show(id(viewer_status), cams[id(cctv_view_cam) & 3]);
          lv_obj_t *grid[4] = {id(cctv_grid_status_1), id(cctv_grid_status_2),
                               id(cctv_grid_status_3), id(cctv_grid_status_4)};
          for (int i = 0; i < 4; i++) show(grid[i], cams[i]);
          id(rec_blink) = !id(rec_blink);
      # Auto-hide the viewer's bottom button bar 5 s after it was shown.
      - lambda: |-
          if (id(viewer_bar_on) && ++id(viewer_bar_ticks) >= 5) {
            id(viewer_bar_on) = false;
            id(viewer_bar_apply)->execute();
          }
      - script.execute: cctv_rec_refresh

# =============================================================================
# Screens
# =============================================================================
lvgl:
  id: lv
  displays:
    - s3_box_lcd
  touchscreens:
    - box_touch
  pages:
    # ------------------------------------------------------------------
    # VIEWER - the home page. One camera, full screen 320x240.
    #   Tap the picture to show the bottom button bar (auto-hides in 5 s):
    #   1-4 pick the camera, FIT/STR/CROP cycles the picture fit, REC
    #   records the camera you're viewing, GRID shows all four.
    # Top row: camera name + REC badge (left), clock + WiFi/HA icons
    # (centre/right), SD free space (top right corner).
    # ------------------------------------------------------------------
    - id: home_page
      bg_color: 0x000000
      on_load:
        - script.execute: viewer_refresh
        - script.execute: aspect_refresh
        - script.execute: viewer_bar_apply
        - script.execute:
            id: cctv_route
            view: 1
      widgets:
        - canvas:
            id: viewer_canvas
            x: 0
            y: 0
            width: 320
            height: 240
            transparent: false
            clickable: true
            on_click:
              - lambda: |-
                  id(viewer_bar_on) = !id(viewer_bar_on);
                  id(viewer_bar_ticks) = 0;
              - script.execute: viewer_bar_apply
        - label:
            id: viewer_status
            text: "Connecting..."
            align: CENTER
            text_font: font_small
            text_color: 0xB7C0CC
        - label:
            id: viewer_name
            text: "${cam1_name}"
            x: 6
            y: 6
            text_font: font_small
            text_color: 0xFFFFFF
            bg_color: 0x000000
            bg_opa: 55%
            pad_all: 3
            radius: 4
        - label:
            id: viewer_clock
            text: ""
            align: TOP_MID
            y: 6
            text_font: font_small
            text_color: 0xFFFFFF
            bg_color: 0x000000
            bg_opa: 55%
            pad_all: 3
            radius: 4
        - label:
            id: viewer_rec
            text: "REC"
            x: 6
            y: 30
            text_font: font_small
            text_color: 0xFFFFFF
            bg_color: 0xE74C3C
            bg_opa: COVER
            pad_all: 3
            radius: 4
            hidden: true
        # Top-right cluster: WiFi + Home Assistant status icons, SD free.
        - label:
            id: wifi_icon
            text: "\uF1EB"
            align: TOP_RIGHT
            x: -118
            y: 8
            text_font: montserrat_18
            text_color: 0xE74C3C
            bg_color: 0x000000
            bg_opa: 55%
            pad_all: 2
            radius: 4
        - label:
            id: ha_icon
            text: "\uF015"
            align: TOP_RIGHT
            x: -92
            y: 8
            text_font: montserrat_18
            text_color: 0xE74C3C
            bg_color: 0x000000
            bg_opa: 55%
            pad_all: 2
            radius: 4
        - label:
            id: viewer_sd
            text: "NO SD"
            align: TOP_RIGHT
            x: -6
            y: 6
