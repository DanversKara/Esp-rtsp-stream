# =============================================================================
# Home Assistant entities + scratch-base sensors/switches (single blocks)
# =============================================================================
switch:
  # Speaker amp enable (scratch base) - amp powered so the speaker is live.
  - platform: gpio
    id: speaker_enable
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_ON
  - platform: template
    id: rec_switch_1
    name: "Record ${cam1_name}"
    icon: mdi:record-rec
    lambda: 'return id(cam1).is_recording();'
    turn_on_action:
      - script.execute:
          id: cctv_rec_set
          cam: 0
          enable: true
    turn_off_action:
      - script.execute:
          id: cctv_rec_set
          cam: 0
          enable: false
  - platform: template
    id: rec_switch_2
    name: "Record ${cam2_name}"
    icon: mdi:record-rec
    lambda: 'return id(cam2).is_recording();'
    turn_on_action:
      - script.execute:
          id: cctv_rec_set
          cam: 1
          enable: true
    turn_off_action:
      - script.execute:
          id: cctv_rec_set
          cam: 1
          enable: false
  - platform: template
    id: rec_switch_3
    name: "Record ${cam3_name}"
    icon: mdi:record-rec
    lambda: 'return id(cam3).is_recording();'
    turn_on_action:
      - script.execute:
          id: cctv_rec_set
          cam: 2
          enable: true
    turn_off_action:
      - script.execute:
          id: cctv_rec_set
          cam: 2
          enable: false
  - platform: template
    id: rec_switch_4
    name: "Record ${cam4_name}"
    icon: mdi:record-rec
    lambda: 'return id(cam4).is_recording();'
    turn_on_action:
      - script.execute:
          id: cctv_rec_set
          cam: 3
          enable: true
    turn_off_action:
      - script.execute:
          id: cctv_rec_set
          cam: 3
          enable: false

select:
  - platform: template
    id: viewer_cam_select
    name: "Viewer Camera"
    icon: mdi:cctv
    update_interval: 5s
    options:
      - "${cam1_name}"
      - "${cam2_name}"
      - "${cam3_name}"
      - "${cam4_name}"
    lambda: |-
      const char *names[4] = {"${cam1_name}", "${cam2_name}", "${cam3_name}", "${cam4_name}"};
      return std::string(names[id(cctv_view_cam) & 3]);
    set_action:
      - lambda: |-
          const char *names[4] = {"${cam1_name}", "${cam2_name}", "${cam3_name}", "${cam4_name}"};
          for (int i = 0; i < 4; i++) {
            if (x == names[i]) {
              id(cctv_view_cam) = i;
              break;
            }
          }
      - script.execute: viewer_refresh
      - if:
          condition:
            lambda: 'return id(current_page) == "home";'
          then:
            - script.execute:
                id: cctv_route
                view: 1

button:
  - platform: template
    name: "Record All Cameras"
    icon: mdi:record-rec
    on_press:
      - lambda: |-
          for (int i = 0; i < 4; i++) id(cctv_rec_set)->execute(i, true);
  - platform: template
    name: "Stop All Recordings"
    icon: mdi:stop
    on_press:
      - lambda: |-
          for (int i = 0; i < 4; i++) id(cctv_rec_set)->execute(i, false);

sensor:
  # Battery (scratch base).
  - platform: adc
    pin: GPIO10
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: "voltage"
    entity_category: "diagnostic"
    update_interval: 30s
    attenuation: auto
    filters:
      - multiply: 4.11
  - platform: copy
    id: battery_percent
    source_id: battery_voltage
    name: "Battery Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: "battery"
    entity_category: "diagnostic"
    filters:
      - lambda: return (x - 2.7) / (4.2 - 2.7) * 100;
      - clamp:
          min_value: 0
          max_value: 100
  # SD card.
  - platform: template
    name: "SD Card Free"
    icon: mdi:sd
    unit_of_measurement: GB
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      if (!id(sd_card).is_mounted()) return NAN;
      return id(sd_card).get_free_gb();
  - platform: template
    name: "SD Card Size"
    icon: mdi:sd
    unit_of_measurement: GB
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 300s
    lambda: |-
      if (!id(sd_card).is_mounted()) return NAN;
      return id(sd_card).get_total_gb();
  - platform: template
    name: "Recordings on SD"
    icon: mdi:filmstrip
    unit_of_measurement: files
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(sd_card).get_recording_count();'
