# =============================================================================
# Home Assistant entities
# =============================================================================
switch:
  - platform: template
    id: rec_switch_1
    name: "Record ${cam1_name}"
    icon: mdi:record-rec
    lambda: 'return id(cam1).is_recording();'
    turn_on_action:
      - script.execute:
          id: cctv_rec_set
          cam: 0
          enable: true
    turn_off_action:
      - script.execute:
          id: cctv_rec_set
          cam: 0
          enable: false
  - platform: template
    id: rec_switch_2
    name: "Record ${cam2_name}"
    icon: mdi:record-rec
    lambda: 'return id(cam2).is_recording();'
    turn_on_action:
      - script.execute:
          id: cctv_rec_set
          cam: 1
          enable: true
    turn_off_action:
      - script.execute:
          id: cctv_rec_set
          cam: 1
          enable: false
  - platform: template
    id: rec_switch_3
    name: "Record ${cam3_name}"
    icon: mdi:record-rec
    lambda: 'return id(cam3).is_recording();'
    turn_on_action:
      - script.execute:
          id: cctv_rec_set
          cam: 2
          enable: true
    turn_off_action:
      - script.execute:
          id: cctv_rec_set
          cam: 2
          enable: false
  - platform: template
    id: rec_switch_4
    name: "Record ${cam4_name}"
    icon: mdi:record-rec
    lambda: 'return id(cam4).is_recording();'
    turn_on_action:
      - script.execute:
          id: cctv_rec_set
          cam: 3
          enable: true
    turn_off_action:
      - script.execute:
          id: cctv_rec_set
          cam: 3
          enable: false
  - platform: template
    id: cctv_float_switch
    name: "CCTV Floating Window"
    icon: mdi:cctv
    lambda: 'return id(cctv_float_on);'
    turn_on_action:
      - globals.set:
          id: cctv_float_on
          value: 'true'
      - script.execute: cctv_float_apply
    turn_off_action:
      - globals.set:
          id: cctv_float_on
          value: 'false'
      - script.execute: cctv_float_apply

select:
  - platform: template
    id: cctv_float_cam_select
    name: "CCTV Floating Camera"
    icon: mdi:cctv
    update_interval: 5s
    options:
      - "${cam1_name}"
      - "${cam2_name}"
      - "${cam3_name}"
      - "${cam4_name}"
    lambda: |-
      const char *names[4] = {"${cam1_name}", "${cam2_name}", "${cam3_name}", "${cam4_name}"};
      return std::string(names[id(cctv_float_cam) & 3]);
    set_action:
      - lambda: |-
          const char *names[4] = {"${cam1_name}", "${cam2_name}", "${cam3_name}", "${cam4_name}"};
          for (int i = 0; i < 4; i++) {
            if (x == names[i]) {
              id(cctv_float_cam) = i;
              break;
            }
          }
      - script.execute: cctv_float_apply
      - if:
          condition:
            lambda: 'return id(current_page) == "home";'
          then:
            - script.execute:
                id: cctv_route
                view: 2

button:
  - platform: template
    name: "Record All Cameras"
    icon: mdi:record-rec
    on_press:
      - lambda: |-
          for (int i = 0; i < 4; i++) id(cctv_rec_set)->execute(i, true);
  - platform: template
    name: "Stop All Recordings"
    icon: mdi:stop
    on_press:
      - lambda: |-
          for (int i = 0; i < 4; i++) id(cctv_rec_set)->execute(i, false);

sensor:
  - platform: template
    name: "SD Card Free"
    icon: mdi:sd
    unit_of_measurement: GB
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      if (!id(sd_card).is_mounted()) return NAN;
      return id(sd_card).get_free_gb();
  - platform: template
    name: "SD Card Size"
    icon: mdi:sd
    unit_of_measurement: GB
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 300s
    lambda: |-
      if (!id(sd_card).is_mounted()) return NAN;
      return id(sd_card).get_total_gb();
  - platform: template
    name: "Recordings on SD"
    icon: mdi:filmstrip
    unit_of_measurement: files
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(sd_card).get_recording_count();'
